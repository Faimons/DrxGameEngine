name: SHIFT Windows build

on:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'Engine/**'
      - 'Games/**'
      - 'ThirdParty/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/shift-windows.yml'
  workflow_dispatch:

# A newer push to the same branch replaces a running build
concurrency:
  group: shift-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - uses: actions/checkout@v5

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $root = "C:/VulkanSDK/current"
          $installer = "$env:RUNNER_TEMP/VulkanSDK.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile $installer
          & $installer --root $root --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installation failed" }
          if (-not (Test-Path "$root/Bin/glslangValidator.exe")) { throw "glslangValidator missing in $root/Bin" }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$root/Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install OpenAL Soft
        shell: pwsh
        run: vcpkg install openal-soft:x64-windows

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DDRX_BUILD_EDITOR=OFF -DDRX_BUILD_TESTS=OFF -DDRX_BUILD_EXAMPLES=OFF
          -DDRX_ENABLE_VALIDATION=OFF

      - name: Build ShiftGame
        shell: pwsh
        run: cmake --build build --config Release --target ShiftGame --parallel

      - name: Package
        shell: pwsh
        run: |
          $out = "package/SHIFT"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item build/bin/Release/ShiftGame.exe $out
          Get-ChildItem build/bin/Release -Filter *.dll | Copy-Item -Destination $out
          Copy-Item Games/Shift/shift.json $out
          Copy-Item -Recurse Games/Shift/Assets (Join-Path $out "Assets")
          Get-ChildItem $out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SHIFT-Windows
          path: package/SHIFT
          if-no-files-found: error
          retention-days: 30
